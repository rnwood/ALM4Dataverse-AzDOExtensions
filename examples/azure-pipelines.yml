# Example Azure DevOps Pipeline using ALM4Dataverse Set Connection Variables
# This example demonstrates how to use the task with WorkloadIdentityFederation

trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

steps:
# Example 1: Using WorkloadIdentityFederation (Recommended)
- task: ALM4DataverseSetConnectionVariables@1
  displayName: 'Set Connection Variables (WorkloadIdentityFederation)'
  inputs:
    authenticationType: 'PowerPlatformSPN'
    PowerPlatformSPN: 'PowerPlatform-WorkloadIdentity'  # Your service connection name
    Environment: 'https://myorg.crm.dynamics.com'

# Use the variables in a custom PowerShell script
- task: PowerShell@2
  displayName: 'Use Connection Variables'
  inputs:
    targetType: 'inline'
    script: |
      Write-Host "Authentication Type: $(BuildTools.AuthenticationType)"
      Write-Host "Environment URL: $(BuildTools.EnvironmentUrl)"
      Write-Host "Application ID: $(BuildTools.ApplicationId)"
      Write-Host "Tenant ID: $(BuildTools.TenantId)"
      Write-Host "OIDC Token Request URL: $(BuildTools.IdTokenRequestUrl)"
      Write-Host "ADO ID Token Request URL: $(BuildTools.AdoIdTokenRequestUrl)"
      Write-Host "Connection String is available for custom scripts"
      # The connection string includes: $(BuildTools.DataverseConnectionString)
      # The ADO OAuth token is available as: $(BuildTools.AdoIdTokenRequestToken)

# Example: Map to Azure environment variables for DefaultAzureCredential
- task: PowerShell@2
  displayName: 'Set Azure Credential Environment Variables'
  inputs:
    targetType: 'inline'
    script: |
      # Map BuildTools variables to Azure SDK environment variables
      Write-Host "##vso[task.setvariable variable=AZURE_TENANT_ID]$(BuildTools.TenantId)"
      Write-Host "##vso[task.setvariable variable=AZURE_CLIENT_ID]$(BuildTools.ApplicationId)"
      
      $authType = "$(BuildTools.AuthenticationType)"
      Write-Host "Authentication Type: $authType"
      
      if ($authType -eq "ClientSecret") {
        Write-Host "##vso[task.setvariable variable=AZURE_CLIENT_SECRET;issecret=true]$(BuildTools.ClientSecret)"
        Write-Host "Configured for ClientSecret authentication"
      }
      elseif ($authType -eq "WorkloadIdentityFederation") {
        Write-Host "Configured for WorkloadIdentityFederation - will use OIDC"
      }

# Now tools using DefaultAzureCredential will automatically authenticate
- script: |
    echo "AZURE_TENANT_ID is set: $AZURE_TENANT_ID"
    echo "AZURE_CLIENT_ID is set: $AZURE_CLIENT_ID"
    # Your scripts using Azure SDK will now automatically authenticate
  displayName: 'Verify Azure Environment Variables'

# Example 2: Using Service Principal with Client Secret
- task: ALM4DataverseSetConnectionVariables@1
  displayName: 'Set Connection Variables (Client Secret)'
  inputs:
    authenticationType: 'PowerPlatformSPN'
    PowerPlatformSPN: 'PowerPlatform-SPN'  # Your service connection name
    Environment: 'https://myorg.crm.dynamics.com'

# Example 3: Using Username/Password (Not recommended for production)
- task: ALM4DataverseSetConnectionVariables@1
  displayName: 'Set Connection Variables (Username/Password)'
  inputs:
    authenticationType: 'PowerPlatformEnvironment'
    PowerPlatformEnvironment: 'PowerPlatform-UserPass'  # Your service connection name
    Environment: 'https://myorg.crm.dynamics.com'
    ApplicationId: '00000000-0000-0000-0000-000000000000'  # Your app registration ID
    RedirectUri: 'http://localhost'
